name: AI Auto Coder & APK Builder
on:
  push:
    paths:
      - 'order.txt'
permissions:
  contents: write
jobs:
  code-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask AI to Update Code
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c '
          import os, json, urllib.request
          order = open("order.txt").read()
          code = open("app/src/main/java/com/tony/promax/TonyService.kt").read()
          prompt = f"Update this Kotlin Android code according to this instruction: {order}. Return ONLY valid Kotlin code without markdown.\n\n{code}"
          url = f"https://googleapis.com{os.environ[\"API_KEY\"]}"
          req = urllib.request.Request(url, data=json.dumps({"contents":[{"parts":[{"text":prompt}]}]}).encode(), headers={"Content-Type":"application/json"})
          res = json.loads(urllib.request.urlopen(req).read())
          new_code = res["candidates"][0]["content"]["parts"][0]["text"].replace("```kotlin","").replace("```","").strip()
          open("app/src/main/java/com/tony/promax/TonyService.kt", "w").write(new_code)
          '
      - name: Commit New Code
        run: |
          git config user.name "Tony AI Bot"
          git config user.email "bot@tony.com"
          git add app/src/main/java/com/tony/promax/TonyService.kt
          git commit -m "AI updated code automatically"
          git push
